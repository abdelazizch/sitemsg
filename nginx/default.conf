server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /server/ {
        deny all;
        return 404;
    }

    location /nginx/ {
        deny all;
        return 404;
    }

    # Bloque tout fichier/dossier caché (.git, .env, .gitignore, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Bloque les fichiers de configuration serveur qui ne devraient jamais être publics
    location ~* ^/(docker-compose\.ya?ml|Dockerfile|\.dockerignore)$ {
        deny all;
        return 404;
    }

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
