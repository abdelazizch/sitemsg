server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;

    location /server/ {
        deny all;
        return 404;
    }

    location /nginx/ {
        deny all;
        return 404;
    }

    # Bloque tout fichier/dossier caché (.git, .env, .gitignore, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Bloque les fichiers de configuration serveur qui ne devraient jamais être publics
    location ~* ^/(docker-compose\.ya?ml|Dockerfile|\.dockerignore)$ {
        deny all;
        return 404;
    }

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://api:3000/sitemap.xml;
        proxy_set_header Host $host;
    }

    location = /actualites/feed.xml {
        proxy_pass http://api:3000/actualites/feed.xml;
        proxy_set_header Host $host;
    }

    location /actualites/ {
        proxy_pass http://api:3000/actualites/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://api:3000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api:3000/uploads/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
